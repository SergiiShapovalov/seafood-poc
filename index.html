<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Морепродукти — каталог</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap&subset=cyrillic">
  <link rel="stylesheet" href="style.css?v=202609271610">
  <script data-goatcounter="https://sergeserge.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <!-- Password gate: keeps crawlers out, not a security boundary -->
  <section id="gate" class="gate">
    <form id="gate-form" class="gate-box">
      <h1>Каталог морепродуктів</h1>
      <p>Демонстраційна версія. Введіть пароль.</p>
      <input id="gate-pass" type="password" autocomplete="current-password" placeholder="Пароль" required>
      <button type="submit">Увійти</button>
      <p id="gate-error" class="gate-error" hidden>Неправильний пароль</p>
    </form>
  </section>

  <main id="app" hidden></main>

  <script src="app.js?v=202609271610"></script>
</body>
</html>
